# Phase 2 — Size Ablation: Width-S (P2-S)
# Smaller width variant of chosen backbone (BiGRU), ~120K params

model:
  name: "bigru"
  embed_dim: 48
  hidden_dim: 96
  num_layers: 1
  dropout: 0.1

optimizer:
  type: "AdamW"
  lr: 0.001
  weight_decay: 0.01

scheduler:
  type: "CosineAnnealingLR"
  T_max: 40
  eta_min: 0.00001
