name: jdwr-v1-two-head-full-kaggle
description: Official full-data JDWR v1 run on a Kaggle CUDA GPU.
data:
  train_path: data/processed/jdwr_v1/train
  dev_path: data/processed/jdwr_v1/dev
  test_path: data/processed/jdwr_v1/test/in_domain
  external_test_path: data/processed/jdwr_v1/test/external
model:
  output_path: models/checkpoints/mvp-chartagger-full-kaggle.pt
  vocab_path: models/checkpoints/mvp-chartagger-full-kaggle-vocab.json
  embedding_dim: 96
  hidden_dim: 192
  num_layers: 1
  dropout: 0.0
training:
  seed: 42
  # Larger than every split so the per-domain sampling quota never truncates data.
  max_train_samples: 1000000
  max_eval_samples: 1000000
  max_len: 1606
  batch_size: 128
  epochs: 12
  max_steps: 0
  learning_rate: 0.001
  log_every: 250
  lambda_boundary: 1.0
  domain_balanced: true
  length_bucket_size: 6400
  pad_to_multiple_of: 32
  device: cuda
evaluation:
  predictions_path: experiments/runs/mvp-chartagger-full-kaggle/test.predictions.jsonl
  report_path: experiments/reports/mvp-chartagger-full-kaggle.json
  report_md_path: experiments/reports/mvp-chartagger-full-kaggle.md
