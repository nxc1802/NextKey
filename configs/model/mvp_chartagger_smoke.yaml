name: jdwr-v1-two-head-smoke
description: Smoke configuration for the JDWR v1 two-head BiGRU.
data:
  train_path: data/processed/jdwr_v1/train
  dev_path: data/processed/jdwr_v1/dev
  test_path: data/processed/jdwr_v1/test/in_domain
  external_test_path: data/processed/jdwr_v1/test/external
model:
  output_path: models/checkpoints/mvp-chartagger-smoke.pt
  vocab_path: models/checkpoints/mvp-chartagger-smoke-vocab.json
  embedding_dim: 64
  hidden_dim: 128
  num_layers: 1
  dropout: 0.0
training:
  seed: 42
  max_train_samples: 20000
  max_eval_samples: 5000
  max_len: 180
  batch_size: 64
  epochs: 2
  learning_rate: 0.001
  log_every: 100
  lambda_boundary: 1.0
  domain_balanced: true
  device: auto
evaluation:
  predictions_path: experiments/runs/mvp-chartagger-smoke/dev.predictions.jsonl
  report_path: experiments/reports/mvp-chartagger-smoke.json
  report_md_path: experiments/reports/mvp-chartagger-smoke.md
