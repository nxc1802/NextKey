# Tri-Head BiGRU Multi-Task Restoration Configuration (Local Feasibility Run)
model:
  name: tri_bigru
  embed_dim: 48
  hidden_dim: 96
  num_layers: 1
  dropout: 0.1

training:
  batch_size: 64
  lr: 0.001
  weight_decay: 1.0e-5
  epochs: 12
  grad_clip: 1.0
  patience: 4
  lambda_diacritic: 1.0
  lambda_correction: 1.0
  lambda_boundary: 1.0

data:
  num_clean_train: 10000      # 10,000 clean sentences
  variants_per_sample: 3      # 3 variants each -> 30,000 training samples
  num_clean_val: 1000         # 1,000 clean validation sentences
  num_clean_test: 1000        # 1,000 clean test sentences
  typo_prob: 0.15
  swap_prob: 0.05
  diacritic_confuse_prob: 0.08
  max_len: 180

device: auto  # mps or cuda or cpu
output_dir: artifacts/phase4_tritask/tri_bigru_small
