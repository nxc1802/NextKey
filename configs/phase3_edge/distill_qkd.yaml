# Phase 3: Quantization-Aware Knowledge Distillation (QKD / Joint QAT-KD INT8)

teacher:
  model_name: "bigru"
  embed_dim: 96
  hidden_dim: 160
  num_layers: 1
  checkpoint_path: "artifacts/phase2/topo_a_wide_shallow/best_model.pt"
  vocab_path: "artifacts/phase2/topo_a_wide_shallow/vocab.json"

model:
  name: "bigru"
  embed_dim: 32
  hidden_dim: 64
  num_layers: 1
  dropout: 0.1

distillation:
  strategy: "qkd"  # Quantization-Aware Knowledge Distillation
  num_bits: 8
  alpha: 0.2
  temperature: 1.0
  temp_annealing: false
  outlier_penalty: 0.0001 # Weight clipping outlier regularizer for INT8 dynamic range

training:
  batch_size: 512
  early_stopping_patience: 8  # Extended patience for discrete QAT weight stabilization

optimizer:
  type: "AdamW"
  lr: 0.002
  weight_decay: 0.0001

scheduler:
  type: "CosineAnnealingLR"
  T_max: 40
  eta_min: 0.00001

